name: Testes de Performance (k6)

on:
  push:
    branches: [ "main", dev]
  
  jobs:
      test-attack:
        runs-on: ubuntu-latest
        
        steps: 
          - name: Checkout 
            uses: actions/checkout@v4

          - name: Lavantar docker
            uses: docker compose up -d db api

          - name: Esperar o db estar pronto
            run: sleep 10

          - name: Executar ataque do k6
            run: docker compose run --rm k6_attack run /app/src/script/teste-carga-servicos.js
        
