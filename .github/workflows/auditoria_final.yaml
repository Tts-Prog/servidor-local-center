name: Testes de Performance (K6)

on:
  push:
    branches: ["main", "dev", "mauro-dev"]

jobs:
  test-attack:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servidor-local # path to the folder with docker-compose.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar docker
        run: docker compose up -d db_v2 api

      - name: Esperar o db estar pronto
        run: sleep 10

      - name: Executar ataque do k6
        run: docker compose run --rm --entrypoint sh k6_attack -c "sleep 10 && k6 run /app/src/script/auditoria-final.js"

