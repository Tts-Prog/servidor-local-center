name: Auditoria Final

on:
  push:
    branches: ["main", "dev", "djeison-dev"]

jobs:
  auditoria:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar Docker
        run: docker compose up -d db api
        working-directory: servidor-local
      - name: Esperar a Base de Dados iniciar
        run: sleep 10

      - name: Executar Auditoria com k6
        run: docker compose run --rm k6_attack run /app/src/script/auditoria-final.js

      - name: Desligar os contentores
        if: always()
        working-directory: servidor-local
        run: docker compose down