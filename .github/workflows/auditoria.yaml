name: Testes de Performance K6

on:
  push:
    branches: ["main", "dev", "annette"]
  pull_request:
    branches: ["main", "dev", "annette"]

jobs:
  test-attack:
    runs-on: ubuntu-latest
  
    defaults:
      run:
        working-directory: servidor-local # path to the folder with docker-compose.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar Docker
        run: docker compose up -d --build db api

      - name: Esperar API estar pronta
        run: |
          sleep 15
          docker compose ps
          docker compose logs api

      - name: Executar ataque do k6
        run: docker compose run --rm k6_attack run /app/src/script/auditoria-final.js

      - name: Mostrar logs se falhar
        if: failure()
        run: docker compose logs

      - name: Desligar Docker
        if: always()
        run: docker compose down -v