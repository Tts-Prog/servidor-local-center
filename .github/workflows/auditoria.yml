name: k6 execution

on:
  push:
    branches: ["wilson-dev"]

jobs:
  test-attack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar docker
        run: docker compose up -d db api

      - name: Esperar o db estar pronto
        run: sleep 10

      - name: Executar ataque do k6
        run: docker compose run --rm k6_attack-2 run /app/src/script/auditoria-final.js
