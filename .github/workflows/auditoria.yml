name: k6 execution

on:
  push:
    branches: ["wilson-dev"]

jobs:
  test-attack:
    runs-on: ubuntu-latest

    defaults:
      run: 
        working-directory: servidor-local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar docker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PG_HOST: ${{ secrets.DB_PG_HOST }}
          DB_PG_PORT: ${{ secrets.DB_PG_PORT }}
          DB_PG_USER: ${{ secrets.DB_PG_USER }}
          DB_PG_PASSWORD: ${{ secrets.DB_PG_PASSWORD }}
          DB_PG_NAME: ${{ secrets.DB_PG_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
        run: DATABASE_URL=$DATABASE_URL JWT_SECRET=$JWT_SECRET docker compose up -d api

      - name: Esperar o db estar pronto
        run: sleep 10

      - name: Executar ataque do k6
        run: docker compose run --rm k6_attack-2 run /app/src/script/auditoria-final.js
