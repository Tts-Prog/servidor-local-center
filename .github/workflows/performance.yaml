name: Testes de Performance (K6)

on:
  push:
    branches: ["main", "dev", "stiven-dev"]

jobs:
  test-attack:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servidor-local # path to the folder with docker-compose.yml

    steps:
     - name: 🐳 Levantar API (Ligada à BD Live)
       env:
         DATABASE_URL: ${{ secrets.DATABASE_URL }}
         JWT_SECRET: ${{ secrets.JWT_SECRET }}
       # Passamos as variáveis para o contentor da API e levantamos apenas a API
       run: DATABASE_URL=$DATABASE_URL JWT_SECRET=$JWT_SECRET docker compose up -d api
       
     - name: Esperar o db estar pronto
       run: sleep 10

     - name: Executar ataque do k6
       run: docker compose run --rm --service-ports k6_attacker run /app/src/script/teste-carga-servicos.js