name: Testes de Performance (k6)

on:
  push:
    branches: ["main", "dev", "wilson-dev"] # Acorda sempre que houver push para a branch principal ou dev

jobs:
  test-attack: # Nome do job
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servidor-local

    steps:
      # Passo A: Descarregar o nosso código para a máquina do GitHub
      - name: 📥 Clonar o Repositório
        uses: actions/checkout@v4

      - name: Levantar api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
          DB_PG_HOST: ${{ secrets.DB_PG_HOST }}
          DB_PG_PORT: ${{ secrets.DB_PG_PORT }}
          DB_PG_NAME: ${{ secrets.DB_PG_NAME }}
          DB_PG_USER: ${{ secrets.DB_PG_USER }}
          DB_PG_PASSWORD: ${{ secrets.DB_PG_PASSWORD }}

        run: docker compose up -d api-2

      # Passo C: Dar 10 segundos para o PostgreSQL inicializar completamente
      - name: ⏳ Esperar pela Base de Dados
        run: sleep 10

      # Passo D: Disparar o k6 por dentro da rede Docker!
      - name: 🚀 Executar Ataque k6
        run: docker compose run --rm --service-ports k6_attack-2 run /app/src/script/teste-carga-servicos.js
