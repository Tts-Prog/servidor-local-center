name: Testes de Performance (K6)

on:
  push:
    branches: ["main", "hericleslopes-dev"]

jobs:
  test-attack:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servidor-local # path to the folder with docker-compose.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🐳 Levantar API (Ligada à BD Live)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        # Passamos as variáveis para o contentor da API e levantamos apenas a API
        run: DATABASE_URL=$DATABASE_URL JWT_SECRET=$JWT_SECRET docker compose up -d api
        
      - name: Levantar docker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PG_HOST: ${{ secrets.DB_PG_HOST }}
          DB_PG_PORT: ${{ secrets.DB_PG_PORT }}
          DB_PG_DATABASE: ${{ secrets.DB_PG_DATABASE }}
          DB_PG_USER: ${{ secrets.DB_PG_USER }}
          DB_PG_PASSWORD: ${{ secrets.DB_PG_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
          

        run: 
         docker compose up -d api

      - name: Esperar o db estar pronto
        run: sleep 10

      - name: Executar ataque do k6
        run: docker compose run --rm k6_attack run /app/src/script/teste-carga-servicos.js
