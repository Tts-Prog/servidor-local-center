name: Testes de Performance (k6)

on:
  push:
    branches: ["main", "dev"]

jobs:
  test-attack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: action/Checkout@v4

      - name: levantar docker
        run: docker compose up -d db api

      - name: Espera o db estar pronto
        run: sleep 10

      - name: Executar o ataque do k6
        run: docker compose run --rm k6_attack run /app/src/script/teste-carga-servicos.js
