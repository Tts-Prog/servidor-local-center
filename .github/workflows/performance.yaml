name: Testes de Performance (K6)


on:
  push:
    branches: ["main", "dev", "fabio-dev"]

jobs:
  test-attack:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servidor-local # path to the folder with docker-compose.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar docker
        env:
          - DATABASE_URL={{secret.DATABASE_URL}}
          - DB_PG_HOST={{secret.DB_PG_HOST}}
          - DB_PG_PORT={{secret.DB_PG_PORT}}
          - DB_PG_NAME={{secret.DB_PG_NAME}}  
          - JWT_SECRET={{secret.JWT_SECRET}}
          - DB_PG_USER={{secret.DB_PG_USER}}
          - PORT={{secret.PORT}}
          - DB_PG_PASSWORD={{secret.DB_PG_PASSWORD}}
          
        run: DATABASE_URL=$DATABASE_URL JWT_SECRET=$JWT_SECRET docker compose up -d api

      - name: Esperar o db estar pronto
        run: sleep 10

      - name: Executar ataque do k6
        run: docker compose run --rm k6_attack run /app/src/script/teste-carga-servicos.js
