name: Testes de Performance (K6)

on:
  push:
    branches: ["main", "dev", "fabio-dev"]

jobs:
  test-attack:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servidor-local # path to the folder with docker-compose.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar docker
        run: docker compose up -d db api

      - name: Esperar o db estar pronto
        run: sleep 20

      - name: Logs da API
        run: docker compose run logs api

      - name: Executar ataque do k6
        run: docker compose run --rm --service-ports k6_attack run /app/src/script/auditoria-final.js
