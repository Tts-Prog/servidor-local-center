services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: servidor_local
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_PG_HOST=${DB_PG_HOST}
      - DB_PG_PORT=${DB_PG_PORT}
      - DB_PG_NAME=${DB_PG_NAME}
      - DB_PG_USER=${DB_PG_USER}
      - DB_PG_PASSWORD=${DB_PG_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_OPTIONS=--dns-result-order=ipv4first # 👈 Corrige o erro ENETUNREACH do Prisma/Neon
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=remote-write-receiver" # 👈 Permite receber dados do k6

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
