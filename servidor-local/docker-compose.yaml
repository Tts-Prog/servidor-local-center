services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Labanta2526
      POSTGRES_DB: servidor_local
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/Servidor-local
      - DB_PG_HOST=db
      - DB_PG_PORT=5432
      - DB_PG_NAME=servidor_local
      - DB_PG_USER=root
      - DB_PG_PASSWORD=rootpassword
      - JWT_SECRET=fsjkfvhsduihjkcgdfjghdfghdcjkvhdfjkhcvnbjfghdfkjgnldfbjdfhguhfbjncvbhfghcvkjbnfdhgdhfçjvkjdhdfuhguidfhgcvjnbcvhbjfcngfjckbhdfughcjkbncvjkbhdkghcvkbncjkgfbhdvbcbvhcv.jvlkdfuvj   
      - PORT=8080
      - NODE_OPTIONS=--dns-result-order=ipv4first # 👈 Corrige o erro ENETUNREACH do Prisma/Neon
    ports:
      - "8080:8080"
    depends_on:
      - db
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver" # 👈 Permite receber dados do k6

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus

  K6_attacker:
    image: grafana/k6:latest
    entrypoint: ["k6"]
    command: ["version"]
    volumes:
      - ./src/script:/scripts:ro
    depends_on:
      - api
      - prometheus
    environment:
    - API_BASE_URL=http://api:8080
    - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
    - K6_PROMETHEUS_RW_TREND_STATS=p(95), avg, min, max

volumes:
  prometheus_data: