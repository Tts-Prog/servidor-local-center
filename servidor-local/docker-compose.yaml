services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRESS_PASSWORD: rootpassword
      POSTGRESS_DC: servidor-local
    ports:
      - "54322:5432"

  api:
    build: .
    environment:
      - DATABASE_URL=postgresql://root:webpass2334!@db:5432/servidor-local
      - DB_PG_HOST="db:5432"
      - DB_PG_NAME=servidor-local
      - DB_PG_USER=root
      - DB_PG_PASSWORD=rootpassword
      - JWT_SECRET=ukfjkffhjdrturtd hgsdfgsdhsgsafgrthsfsdfgwstghsdgtsdfheyjdyhjdassdfagrgwrthsdtghs
      - PORT=8080 
    ports: 
      - "8080:8080"
    depends_on:
      - db

  k6_attack:
    image: grafana/k6:latest
    volumes:
      - ./scripts
    command: ["sleep","infinity"]
    depends_on:
      - api
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBO_HOSTARD=true
      - K6_WEB_DASHBOARD_HOST=0.0.0.0