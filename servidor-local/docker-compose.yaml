services:
  db_v2:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: servidor_local  # Fixed typo
    ports:
      - "5432:5432"
    networks:
      - app-network

  api:
    build: .
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - DB_PG_HOST=${DB_PG_HOST:?Set DB_PG_HOST}
      - DB_PG_PORT=${DB_PG_PORT:?Set DB_PG_PORT}
      - DB_PG_NAME=${DB_PG_NAME:?Set DB_PG_NAME}
      - DB_PG_USER=${DB_PG_USER:?Set DB_PG_USER}
      - DB_PG_PASSWORD=${DB_PG_PASSWORD:?Set DB_PG_PASSWORD}
      - PORT=8080
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first 
    ports:
      - "8080:8080"
    depends_on:
      - db_v2
    restart: on-failure
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - app-network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - app-network

  k6_attack:
    image: grafana/k6:latest
    volumes:
      - ./src:/app/src
    command: ["sleep", "infinity"]
    depends_on:
      - api
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  grafana-storage: