services:
  db_v2:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: servidor_local  # Fixed typo
    ports:
      - "5432:5432"
    networks:
      - app-network

  api:
    build: .
    environment:
      - DATABASE_URL=postgresql://root:Webpass2334!@db_v2:5432/servidor_local
      - DB_PG_HOST=db_v2
      - DB_PG_PORT=5432
      - DB_PG_NAME=servidor_local
      - DB_PG_USER=root
      - DB_PG_PASSWORD=rootpassword
      - JWT_SECRET=fsjkfvhsduihjkcgdfjghdfghdcjkvhdfjkhcvnbjfghdfkjgnldfbjdfhguhfbjncvbhfghcvkjbnfdhgdhfçjvkjdhdfuhguidfhgcvjnbcvhbjfcngfjckbhdfughcjkbncvjkbhdkghcvkbncjkgfbhdvbcbvhcv.jvlkdfuvj
      - PORT=8080
      - NODE_ENV=production  # Add this
    ports:
      - "8080:8080"
    depends_on:
      - db_v2
    restart: on-failure
    networks:
      - app-network

  k6_attack:
    image: grafana/k6:latest
    volumes:
      - ./src:/app/src
    command: ["sleep", "infinity"]
    depends_on:
      - api
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge