services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: servidor_local
    ports:
      - "5432:5432"
    networks:
      - app-network

  api:
    build: .
    # image: servidor-local-api-2 
    environment:
      # - DATABASE_URL="postgresql://root:rootpassword:5432/servidor-local"
      - DB_PG_HOST=db
      - DB_PG_PORT=5432
      - DB_PG_NAME=servidor_local
      - DB_PG_USER=root
      - DB_PG_PASSWORD=rootpassword
      - JWT_SECRET=slcnoibcidbliabaukvlusgcuildsbciuewbuicbeiucbeucw
      - PORT=8080
      - NODE_OPTIONS=--dns-result-order=ipv4first
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./src:/app/src
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=remote-write-receiver" # 👈 Permite receber dados do k6
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - app-network

  k6_attack:
    image: grafana/k6:latest
    volumes:
      - ./src/script:/home/k6/script # 👈 monta em WORKDIR do k6
    entrypoint: ["k6"]
    command: ["run", "/home/k6/script/teste-carga-servicos.js"]
    depends_on:
      - api
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_HOST=0.0.0.0
    networks:
      - app-network

networks:
  app-network:
    driver: bridge