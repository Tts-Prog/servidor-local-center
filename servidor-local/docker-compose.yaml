 services:
  db:
    image: postgres:15
    environment:
      - host=localhost
      - port=5432
      - name=servidor_local
      - user=root
      - password=webpass2334!
    ports:
      - "5432:5432"
  
    
  api:
    build: .
    image: img-servidor-local
    environment:
      - DATABASE_URL=postgresql://root:webpass2334!@db:5432/servidor-local
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
  k6_attack:
    image: grafana/k6:latest
    volumes:
      - ./k6-scripts:/scripts
    command: ["sleep", "infinity"]
    depends_on:
      - api
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD_URL=true
      - K6_WEB_DASHBOARD_HOST=0.0.0.0