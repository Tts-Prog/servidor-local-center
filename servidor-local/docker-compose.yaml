services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-servidor_local}
    ports:
      - "5432:5432"
    #volumes: 
    # - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    # image: servidor-local
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_PG_HOST=${DB_PG_HOST:-db}
      - DB_PG_PORT=${DB_PG_PORT:-5432}
      - DB_PG_NAME=${DB_PG_NAME:-servidor_local}
      - DB_PG_USER=${DB_PG_USER:-postgres}
      - DB_PG_PASSWORD=${DB_PG_PASSWORD:-postgres}
      - PORT=${PORT:-8080}
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - db
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus

  k6_attacker:
    image: grafana/k6:latest
    entrypoint: ["k6"]
    command: ["version"]
    volumes:
      - ./src/script:/scripts:ro
    depends_on:
      - api
      - prometheus
    environment:
      - API_BASE_URL=http://api:8080
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),avg,min,max

volumes:
  prometheus_data:
