services:
  db-2:
    image: postgres:15
    environment:
      - POSTGRES_USER=${DB_PG_USER:?Set DB_PG_USER}
      - POSTGRES_PASSWORD=${DB_PG_PASSWORD:?Set DB_PG_PASSWORD}
      - POSTGRES_DB=${DB_PG_NAME:?Set DB_PG_NAME}
    ports:
      - "5432:5432"

  api-2:
    build: .
    # image: servidor-local
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - DB_PG_HOST=${DB_PG_HOST:?Set DB_PG_HOST}
      - DB_PG_PORT=${DB_PG_PORT:?Set DB_PG_PORT}
      - DB_PG_USER=${DB_PG_USER:?Set DB_PG_USER}
      - DB_PG_PASSWORD=${DB_PG_PASSWORD:?Set DB_PG_PASSWORD}
      - DB_PG_NAME=${DB_PG_NAME:?Set DB_PG_NAME}
      - PORT=${PORT:?Set PORT}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
    
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver" # 👈 Permite receber dados do k6

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  k6_attack-2:
    image: grafana/k6:latest
    entrypoint: ["k6"]
    command: ["version"]
    volumes:
      - ./src:/app/src
    depends_on:
      - api-2
      - prometheus
    ports:
      - "5665:5665"
    environment:
      - API_BASE_URL=http://api-2:8080
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATUS=p(95), p(99), avg, min, max
volumes:
  prometheus-data: