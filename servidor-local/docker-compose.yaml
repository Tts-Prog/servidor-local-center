services:
  api:
    build: .
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
      - DB_PG_HOST=${DB_PG_HOST}
      - DB_PG_PORT=${DB_PG_PORT}
      - DB_PG_NAME=${DB_PG_NAME}
      - DB_PG_USER=${DB_PG_USER}
      - DB_PG_PASSWORD=${DB_PG_PASSWORD}
      - NODE_OPTIONS=--dns-result-order=ipv4first # 👈 Corrige o erro ENETUNREACH do Prisma/Neon
    ports:
      - "8080:8080"

  k6_attack:
    image: grafana/k6:latest
    volumes:
      - ./src/script:/app/src/script # 👈 Monta os scripts k6 no container
    depends_on:
      - api
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=remote-write-receiver" # 👈 Permite receber dados do k6

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus