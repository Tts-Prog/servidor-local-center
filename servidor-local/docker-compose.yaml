services:
  db:
    image: postgres:15
    environment:
        POSTEGRES_USER: root
        POSTEGRES_PASSWORD: rootpassword
        POSTREGRES_DB: servidor-local
    ports:
        - "5432:5432"


  api:
    build: .
    environment:
      - DATABASE_URL:postgresql://root:Webpass2334!@db:5432/servidor-local
      - DB_PG_HOST="db:5432"
      - DB_PG_NAME=servidor-local
      - DB_PG_USER=root
      - DB_PG_PASSWORD=rootpassword
      - JWT_SECRET=jbfisduidsvhfpuidsbhvjdsbhvuipfvjqewdbsvuipqsadbvjnewsdbaç
      - PORT:8080
    ports:
      - "8080:8080"
    depends_on:
      - db
  
  k6_attacker:
    image: grafana/k6:latest
    volumes:
      - ./scripts
    command: ["sleep", "infinity"]
    depends_on:
      - api
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_:DASHBOARD=true
      - K6_WEB_:DASHBOARD_HOST=0.0.0.0
