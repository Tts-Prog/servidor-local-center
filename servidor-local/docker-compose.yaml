
name: servidor-local-center
services:
  #serviços a serem executados
  db:
    #serviço de base de dados
    image: postgres:15 #imagem da base de dados
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Webpass2334!
      POSTGRES_DB: servidor_local
    ports:
      - "5432:5432"
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data

  api:
    #serviço do servidor local
    build: . # Constrói a vossa API a partir do Dockerfile
    env:
         DATABASE_URL: ${{secrets.DATABASE_URL}}
         JWT_SECRET: ${{secrets.JWT_SECRET}}
         PORT: ${{secrets.PORT}}
         DB_PG_HOST: ${{secrets.DB_PG_HOST}}
         DB_PG_PORT: ${{secrets.DB_PG_PORT}}
         DB_PG_NAME: ${{secrets.DB_PG_NAME}}
         DB_PG_USER: ${{secrets.DB_PG_USER}}
         DB_PG_PASSWORD: ${{secrets.DB_PG_PASSWORD}}
    run: docker compose up -d api 
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
    # depends_on:
    #   - dbZZZZZZZZZZZZZZZZZZ

  k6_attacker:
    #serviço de k6_attacker
    image: grafana/k6:latest #imagem de k6_attacker
    volumes:
      - ./src:/app/src
    command: [ "sleep", "infinity" ]
    depends_on:
      - api
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true
      # - K6_WEB_DASHBOARD_HOST: 0.0.0.0
