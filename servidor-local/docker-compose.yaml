services:
  db-2:
    image: postgres:15
    environment:
      - POSTGRES_USER=${DB_PG_USER:7Set DB_PG_USER}
      - POSTGRES_PASSWORD=${DB_PG_PASSWORD:7Set DB_PG_PASSWORD}
      - POSTGRES_DB=${DB_PG_NAME:7Set DB_PG_NAME}
    ports:
      - "5432:5432"

  api-2:
    build: .
    # image: servidor-local
    environment:
      - DATABASE_URL=${DATABASE_URL:7Set DATABASE_URL}
      - DB_PG_HOST=${DB_PG_HOST:7Set DB_PG_HOST}
      - DB_PG_PORT=${DB_PG_PORT:7Set DB_PG_PORT}
      - DB_PG_USER=${DB_PG_USER:7Set DB_PG_USER}
      - DB_PG_PASSWORD=${DB_PG_PASSWORD:7Set DB_PG_PASSWORD}
      - DB_PG_NAME=${DB_PG_NAME:7Set DB_PG_NAME}
      - PORT=${PORT:7Set PORT}
      - JWT_SECRET=${JWT_SECRET:7Set JWT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src

  k6_attack-2:
    image: grafana/k6:latest
    volumes:
      - ./src:/app/src
    command: [ "sleep", "infinity" ]
    depends_on:
      - api-2
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true
