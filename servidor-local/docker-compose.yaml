services:
  db:
    image: postgres:15
    environment:
        POSTGRES_USER: root
        POSTGRES_PASSWORD: rootpassword
        POSTGRES_DB: servidor_local
    ports:
        - "5432:5432"


  api:
    build: .
    environment:
      - DATABASE_URL:postgresql://root:Webpass2334!@db:5432/servidor-local
      - DB_PG_HOST=db
      - DB_PG_PORT=5432
      - DB_PG_NAME=servidor_local
      - DB_PG_USER=root
      - DB_PG_PASSWORD=rootpassword
      - PORT:8080
      - JWT_SECRET="fsjkfvhsduihjkcgdfjghdfghdcjkvhdfjkhcvnbjfghdfkjgnldfbjdfhguhfbjncvbhfghcvkjbnfdhgdhfçjvkjdhdfuhguidfhgcvjnbcvhbjfcngfjckbhdfughcjkbncvjkbhdkghcvkbncjkgfbhdvbcbvhcv.jvlkdfuvj"

    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./src:/app/src
  
  k6_attack:
    image: grafana/k6:latest
    volumes:
      - ./src:/app/src
    command: ["sleep", "infinity"]
    depends_on:
      - api
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true
      # - K6_WEB_:DASHBOARD_HOST=0.0.0.0