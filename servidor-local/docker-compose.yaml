services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "5432:5432"
    #volumes: 
    # - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    # image: servidor-local
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - DB_PG_HOST=${DB_PG_HOST:?Set DB_PG_HOST}
      - DB_PG_PORT=${DB_PG_PORT:?Set DB_PG_PORT}
      - DB_PG_NAME=${DB_PG_NAME:?Set DB_PG_NAME}
      - DB_PG_USER=${DB_PG_USER:?Set DB_PG_USER}
      - DB_PG_PASSWORD=${DB_PG_PASSWORD:?Set DB_PG_PASSWORD}
      - PORT=${PORT:?Set PORT}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - db
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus

  k6_attacker:
    image: grafana/k6:latest
    entrypoint: [ "k6" ]
    command: [ "version" ]
    volumes:
      - ./src/script:/scripts:ro
    depends_on:
      - api
      - prometheus
    environment:
      - API_BASE_URL=http://api:8080
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),avg,min,max

volumes:
  prometheus_data:
